      <circle cx="138" cy="239" r="18" fill="url(#glassS1)"/>
      <circle cx="138" cy="239" r="8.5" fill="#0B0C0F"/>
      <circle cx="131.5" cy="232" r="4" fill="#FFFFFF" opacity="0.55"/><circle cx="138" cy="300" r="11" fill="#F4E6C8"/></g>
    <rect x="0" y="0" width="280" height="560" rx="46" fill="url(#sheen)"/>
