      <circle cx="138" cy="162" r="21.599999999999998" fill="url(#glassS0)"/>
      <circle cx="138" cy="162" r="10.200000000000001" fill="#0B0C0F"/>
      <circle cx="130.2" cy="153.6" r="4.8" fill="#FFFFFF" opacity="0.55"/>
