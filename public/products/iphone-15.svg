<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="iphone-15 rendering">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9C8CE"/>
      <stop offset="45%" stop-color="#d9c8ce"/>
      <stop offset="100%" stop-color="#8f8488"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20242B"/>
      <stop offset="55%" stop-color="#11141A"/>
