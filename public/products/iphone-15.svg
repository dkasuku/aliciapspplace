    <rect x="10" y="10" width="260" height="540" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <g transform="translate(0 0) scale(0.78)">
      <rect x="96" y="118" width="150" height="150" rx="46" fill="#b2a4a9" stroke="#8b8084" stroke-width="2"/>
      
      <circle cx="144" cy="166" r="34" fill="#15161A"/>
      <circle cx="144" cy="166" r="24.48" fill="url(#glassA)"/>
      <circle cx="144" cy="166" r="11.56" fill="#0B0C0F"/>
      <circle cx="135.16" cy="156.48" r="5.44" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="198" cy="220" r="34" fill="#15161A"/>
      <circle cx="198" cy="220" r="24.48" fill="url(#glassB)"/>
      <circle cx="198" cy="220" r="11.56" fill="#0B0C0F"/>
      <circle cx="189.16" cy="210.48" r="5.44" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="198" cy="166" r="14" fill="#F4E6C8"/>
