    <radialGradient id="glassB" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#3C4A63"/>
      <stop offset="55%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="glassC" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#3C4A63"/>
      <stop offset="55%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="glassS0" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#3C4A63"/>
      <stop offset="55%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="glassS1" cx="0.35" cy="0.3" r="0.8">
